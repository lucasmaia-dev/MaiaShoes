name: Verificações

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Front-end — build e TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Back-end — migrações, build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://maiashoes_ci:ci_only_password@127.0.0.1:5432/maiashoes_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://maiashoes_ci:ci_only_password@127.0.0.1:5432/maiashoes_shadow?schema=public
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: maiashoes_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: maiashoes_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maiashoes_ci -d maiashoes_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - name: Conferir importação do catálogo no PostgreSQL
        run: npm run catalog:import
      - name: Conferir o banco real pela API
        run: |
          node dist/main.js > /tmp/maiashoes-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health/database > /tmp/maiashoes-health.json; then
              cat /tmp/maiashoes-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/maiashoes-api.log
          exit 1
